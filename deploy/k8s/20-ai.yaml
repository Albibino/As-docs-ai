---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: as-docs-ai
  namespace: as-docs
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: as-docs-ai
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: as-docs-ai
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - run
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
        command:
        - caddy
        image: caddy:2.11.9-alpine
        imagePullPolicy: IfNotPresent
        name: tls-proxy
        ports:
        - containerPort: 8443
          name: https-ai
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: 8443
          timeoutSeconds: 1
        resources:
          limits:
            memory: 128Mi
            ephemeral-storage: 512Mi
          requests:
            cpu: 25m
            memory: 48Mi
            ephemeral-storage: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/asdocs/tls
          name: ai-tls
          readOnly: true
        - mountPath: /etc/caddy/Caddyfile
          name: ai-tls-config
          readOnly: true
          subPath: Caddyfile
        - mountPath: /data
          name: caddy-data
        - mountPath: /config
          name: caddy-config
      - envFrom:
        - configMapRef:
            name: as-docs-ai-config
        - secretRef:
            name: as-docs-ai-secret
        image: 362749056012.dkr.ecr.us-east-1.amazonaws.com/as-docs-ai:oauth-prep-20261124-154201
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: 8000
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: ai
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 1Gi
            ephemeral-storage: 1Gi
          requests:
            cpu: 200m
            memory: 384Mi
            ephemeral-storage: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: as-docs-ai
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: ai-tls
        secret:
          defaultMode: 420
          secretName: as-docs-ai-tls
      - configMap:
          defaultMode: 420
          name: as-docs-ai-caddy
        name: ai-tls-config
      - emptyDir: {}
        name: caddy-data
      - emptyDir: {}
        name: caddy-config
      - emptyDir: {}
        name: tmp
---
apiVersion: v1
kind: Service
metadata:
  name: as-docs-ai
  namespace: as-docs
spec:
  type: ClusterIP
  selector:
    app: as-docs-ai
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-ingress
  namespace: as-docs
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: as-docs-backend
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app: as-docs-ai
  policyTypes:
  - Ingress
