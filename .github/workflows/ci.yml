name: CI - As-docs-ai

on:
  push:
    branches:
      - main
      - feature/aws-academy-deploy
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Testes e qualidade Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked --extra dev --python 3.12 --no-build --no-install-project

      - name: Executar Ruff
        run: uv run --no-sync ruff check .

      - name: Executar pytest
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m pytest -q