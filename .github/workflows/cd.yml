name: CD - As-docs-ai (AWS Learner Lab)

# Publica a imagem da IA no ECR e implanta no EKS do ambiente learner-lab.
# Disparo: tag vX.Y.Z (release) ou manual. O job usa o environment
# "learner-lab" (aprovação manual + credenciais temporárias do Lab).
#
# Por que o runner abre o endpoint do EKS: a API do cluster só aceita o IPv4 do
# operador. No Learner Lab não é possível dar permissão de deploy a uma EC2 via
# SSM (os nós usam a própria LabRole, cuja access entry é EC2_LINUX). Então o
# job adiciona o IP do runner ao endpoint (~30s), aplica e remove no final,
# mesmo em caso de falha, devolvendo o cluster à configuração do Terraform.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-learner-lab-ai
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar e implantar IA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: learner-lab
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS (sessão do Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Conferir conta
        run: |
          conta=$(aws sts get-caller-identity --query Account --output text)
          if [ "$conta" != "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "::error::Credenciais da conta $conta, esperado ${{ vars.AWS_ACCOUNT_ID }} (sessão do Lab expirada ou trocada?)."
            exit 1
          fi

      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Publicar IA no ECR
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/as-docs-ai:${{ github.sha }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

      - name: Liberar IP do runner no endpoint do EKS
        id: endpoint
        run: |
          ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "cidr=$ip/32" >> "$GITHUB_OUTPUT"
          bash .github/scripts/eks-endpoint.sh open "$ip/32"

      - name: Implantar IA no EKS
        env:
          IMAGE: ${{ env.REGISTRY }}/as-docs-ai@${{ steps.image.outputs.digest }}
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          kubectl -n as-docs set image deployment/as-docs-ai ai="$IMAGE"
          kubectl -n as-docs rollout status deployment/as-docs-ai --timeout=10m

      - name: Remover IP do runner do endpoint do EKS
        if: always() && steps.endpoint.outputs.cidr != ''
        run: bash .github/scripts/eks-endpoint.sh close "${{ steps.endpoint.outputs.cidr }}"
