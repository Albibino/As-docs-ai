[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tcc-docs-ai"
version = "0.2.0"
description = "Serviço de IA do TCC: conversa, dúvidas e escrita assistida sobre documentos"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "langchain-core>=0.3,<2",
  "mcp>=1.12,<3",
  "openai>=1.99,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.14,<3",
  "redis>=5,<7",
  "tiktoken>=0.11,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_docs_ai"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

